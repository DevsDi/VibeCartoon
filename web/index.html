<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Vibe Agent Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ====================== 断连横幅 ====================== -->
  <!-- 轮询失败时由 JS 显示，恢复成功后隐藏 -->
  <div id="conn-banner" class="conn-banner hidden" role="alert">
    <span class="conn-dot" aria-hidden="true"></span>
    <span>连接断开，正在自动重连…</span>
  </div>

  <!-- ====================== 顶部标题条 ====================== -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <h1 class="brand-title">Vibe <span class="brand-accent">Agent</span> Dashboard</h1>
        <p class="brand-subtitle">Claude Code 各 Agent 工作进度</p>
        <span id="updated-at" class="updated-at">—</span>
      </div>
    </div>
  </header>

  <!-- ====================== 主体 ====================== -->
  <main class="app-main">
    <div class="wrap">

      <!-- 空状态占位（无任何 Agent 时展示） -->
      <section id="empty-state" class="empty-state">
        <div class="empty-icon" aria-hidden="true">🧊</div>
        <h2 class="empty-title">暂无 Agent 活动</h2>
        <p class="empty-sub">Agent 接入看板后，这里会实时显示每个 Agent 的工作进度。</p>
      </section>

      <!-- 看板主区：左主 Agent + 右子 Agent（一列多行） -->
      <section id="board-wrap" class="board-wrap hidden">
        <div class="board-left">
          <div class="board-left-title">主 Agent</div>
          <div id="main-grid" class="main-agent-grid" aria-label="主 Agent"></div>
        </div>
        <div class="board-right">
          <div class="board-right-title">子 Agent</div>
          <div id="active-grid" class="agent-grid" aria-label="子 Agent"></div>
        </div>
      </section>

    </div>
  </main>

  <!-- ====================== 页脚 ====================== -->
  <footer class="app-footer">
  </footer>

  <script src="app.js"></script>
</body>
</html>
