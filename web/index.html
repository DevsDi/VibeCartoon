<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Vibe Agent Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ====================== 断连横幅 ====================== -->
  <!-- 轮询失败时由 JS 显示，恢复成功后隐藏 -->
  <div id="conn-banner" class="conn-banner hidden" role="alert">
    <span class="conn-dot" aria-hidden="true"></span>
    <span>连接断开，正在自动重连…</span>
  </div>

  <!-- ====================== 顶部标题条 ====================== -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <h1 class="brand-title">Vibe <span class="brand-accent">Agent</span> Dashboard</h1>
        <p class="brand-subtitle">Claude Code 各 Agent 工作进度</p>
      </div>

      <!-- 实时 summary 徽章 -->
      <div class="summary" id="summary">
        <span class="sum-badge b-total"><span class="sum-label">总数</span><span class="sum-value" id="sum-total">0</span></span>
        <span class="sum-badge b-active"><span class="sum-label">进行中</span><span class="sum-value" id="sum-active">0</span></span>
        <span class="sum-badge b-queued"><span class="sum-label">排队</span><span class="sum-value" id="sum-queued">0</span></span>
        <span class="sum-badge b-thinking"><span class="sum-label">思考</span><span class="sum-value" id="sum-thinking">0</span></span>
        <span class="sum-badge b-tool"><span class="sum-label">工具</span><span class="sum-value" id="sum-tool">0</span></span>
        <span class="sum-badge b-done"><span class="sum-label">完成</span><span class="sum-value" id="sum-done">0</span></span>
        <span class="sum-badge b-failed"><span class="sum-label">失败</span><span class="sum-value" id="sum-failed">0</span></span>
      </div>
    </div>
  </header>

  <!-- ====================== 主体 ====================== -->
  <main class="app-main">
    <div class="wrap">

      <!-- 空状态占位（无任何 Agent 时展示） -->
      <section id="empty-state" class="empty-state">
        <div class="empty-icon" aria-hidden="true">🧊</div>
        <h2 class="empty-title">暂无 Agent 活动</h2>
        <p class="empty-sub">子 Agent 接入看板后，这里会实时显示每个 Agent 的工作进度。</p>
      </section>

      <!-- 进行中 Agent 卡片网格 -->
      <section id="active-wrap" class="active-wrap hidden">
        <p id="no-active-note" class="no-active-note hidden">当前没有进行中的 Agent，可展开下方查看已完成任务。</p>
        <div id="active-grid" class="agent-grid" aria-label="进行中的 Agent"></div>
      </section>

      <!-- 完成 / 失败 折叠区 -->
      <section id="finished-section" class="finished-section hidden">
        <div id="finished-head" class="finished-head" role="button" tabindex="0" aria-expanded="true">
          <span class="finished-title">已完成 / 失败</span>
          <span class="finished-count" id="finished-count">0</span>
          <span class="chevron" id="finished-chevron" aria-hidden="true">▾</span>
        </div>
        <div id="finished-list" class="finished-list"></div>
      </section>

    </div>
  </main>

  <!-- ====================== 页脚 ====================== -->
  <footer class="app-footer">
    <span class="footer-note">每 0.6 秒自动刷新</span>
    <span id="updated-at" class="updated-at">—</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
