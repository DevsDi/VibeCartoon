<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Vibe Agent Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 无障碍播报区（P1）：屏幕阅读器可感知的状态变化，视觉隐藏（见 style.css .sr-only） -->
  <div id="status-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <!-- ====================== 断连横幅 ====================== -->
  <!-- 轮询失败时由 JS 显示，恢复成功后隐藏 -->
  <div id="conn-banner" class="conn-banner hidden" role="alert">
    <span class="conn-dot" aria-hidden="true"></span>
    <span>连接断开，正在自动重连…</span>
  </div>

  <!-- ====================== 顶部标题条 ====================== -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <h1 class="brand-title">Vibe <span class="brand-accent">Agent</span> Dashboard</h1>
        <p class="brand-subtitle">Claude Code 各 Agent 工作进度</p>
        <span id="updated-at" class="updated-at">—</span>
      </div>

      <!-- 顶部操作区（P1）：特效密度 / 音效开关 -->
      <div class="header-actions">
        <label class="ctl-label" for="motion-select">特效</label>
        <select id="motion-select" class="ctl-select">
          <option value="auto">自动</option>
          <option value="reduced">减少</option>
          <option value="off">关闭</option>
        </select>
        <label class="ctl-label ctl-check" for="sound-toggle">
          <input type="checkbox" id="sound-toggle" />
          <span>音效</span>
        </label>

        <!-- 音效启用轻提示（P1）：仅首次访问且尚未点击页面时显示；点击页面任意位置或 ✕ 后淡出移除（见 app.js） -->
        <div id="sound-tip" class="sound-tip hidden">
          <span class="sound-tip-text">🔊 点击页面启用完成音效</span>
          <button type="button" class="sound-tip-close" data-close aria-label="关闭提示">✕</button>
        </div>
      </div>
    </div>
  </header>

  <!-- ====================== 主体 ====================== -->
  <main class="app-main">
    <div class="wrap">

      <!-- 空状态占位（无任何 Agent 时展示） -->
      <section id="empty-state" class="empty-state">
        <div class="empty-icon" aria-hidden="true">🧊</div>
        <!-- 空状态场景（方向 D）：雷达扫描 + 待机小人，与 🧊 浮动图标共存 -->
        <div class="empty-scene" aria-hidden="true">
          <div class="empty-radar"></div>
          <svg class="empty-stick" viewBox="0 0 30 40" aria-hidden="true">
            <text x="15" y="12" text-anchor="middle" font-size="11">😴</text>
            <line x1="15" y1="14" x2="15" y2="26" stroke="currentColor" stroke-width="2.5"></line>
            <line x1="15" y1="18" x2="7" y2="22" stroke="currentColor" stroke-width="2.5"></line>
            <line x1="15" y1="18" x2="23" y2="22" stroke="currentColor" stroke-width="2.5"></line>
            <line x1="15" y1="26" x2="10" y2="35" stroke="currentColor" stroke-width="2.5"></line>
            <line x1="15" y1="26" x2="20" y2="35" stroke="currentColor" stroke-width="2.5"></line>
          </svg>
        </div>
        <h2 class="empty-title">暂无 Agent 活动</h2>
        <p class="empty-sub">Agent 接入看板后，这里会实时显示每个 Agent 的工作进度。</p>
      </section>

      <!-- 看板主区：左主 Agent + 右子 Agent（一列多行） -->
      <section id="board-wrap" class="board-wrap hidden">
        <div class="board-left">
          <div class="board-left-title">主 Agent</div>
          <div id="main-grid" class="main-agent-grid" aria-label="主 Agent"></div>
        </div>
        <div class="board-right">
          <div class="board-right-title">子 Agent</div>
          <div id="active-grid" class="agent-grid" aria-label="子 Agent"></div>
        </div>
      </section>

    </div>
  </main>

  <!-- ====================== 页脚 ====================== -->
  <footer class="app-footer">
  </footer>

  <script src="app.js"></script>
</body>
</html>
