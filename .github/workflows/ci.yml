# vc-dashboard CI —— 单元测试（collect，纯 Node 零依赖）
#
# 策略：
#   - Node 20 / 22 矩阵，ubuntu-latest
#   - collect 单测（npm run test:unit）纯 Node 零依赖，无需服务/浏览器，npm install 后直接跑
#   - Playwright E2E 已移除（2026-08）：不再安装浏览器内核、不再启动看板服务、不再上传测试报告

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run collect unit tests
        run: npm run test:unit
